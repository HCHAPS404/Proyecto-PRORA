# Blueprint Render (plan free): API + Postgres.
# Los background workers NO admiten plan free en Render; el worker de ingesta/ML
# corre embebido en el mismo servicio web (PRORA_EMBEDDED_WORKER=true).
#
# Flujo del usuario:
# 1. Push a main
# 2. Render → New → Blueprint → este repo
# 3. Copiar URL HTTPS de prora-api
# 4. GitHub → Variables → PRORA_API_BASE_URL=https://….onrender.com/api/v1
# 5. Republicar Pages
#
# Guía detallada: docs/DEPLOY-RENDER.md

databases:
  - name: prora-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: prora-api
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Comando completo: Render a veces no combina bien CMD corto con ENTRYPOINT.
    dockerCommand: "./docker-entrypoint.sh api"
    # /health no depende de la DB; evita marcar failed si Postgres tarda en aceptar conexiones.
    healthCheckPath: /health
    envVars:
      - key: PRORA_ENVIRONMENT
        value: production
      - key: PRORA_AUTO_CREATE_TABLES
        value: "false"
      - key: PRORA_RUN_MIGRATIONS_ON_START
        value: "true"
      # En free: activar solo cuando la API ya está estable (Environment → true).
      # El supervisor espera /health antes de cargar el worker (sklearn).
      - key: PRORA_EMBEDDED_WORKER
        value: "false"
      - key: PRORA_WORKER_POLL_SECONDS
        value: "10"
      - key: PRORA_CORS_ORIGINS
        value: '["https://hchaps404.github.io"]'
      - key: PRORA_JWT_SECRET
        generateValue: true
      - key: PRORA_DATABASE_URL
        fromDatabase:
          name: prora-db
          property: connectionString
      - key: PRORA_MODEL_REGISTRY_PATH
        value: /app/artifacts/models
      - key: PRORA_INSTITUTIONAL_UPLOAD_DIR
        value: /app/data/inbox
      - key: PRORA_RAW_SNAPSHOT_DIR
        value: /app/data/raw
      # Opcionales en Dashboard (Environment): PRORA_SOCRATA_APP_TOKEN,
      # PRORA_BOOTSTRAP_ADMIN_EMAIL / _PASSWORD / _NAME — ver docs/DEPLOY-RENDER.md.
